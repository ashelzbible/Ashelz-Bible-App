# One-click deploy on Render (https://render.com): New → Blueprint → pick this repo. Render gives you an https:// address
# you can open on your phone and "Add to Home screen". The free plan sleeps when idle and its disk is temporary: fine for
# trying the app, not for keeping photos and voice notes long term (use a paid plan with the disk below for that).
services:
  - type: web
    name: wazzupp
    runtime: docker
    rootDir: wazzupp
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: wazzupp-db, property: connectionString }
      - key: URL_SIGNING_SECRET
        generateValue: true
      - key: RELAXED_PASSWORDS
        value: "true"   # testing only: accepts any password of 4+ characters. Remove before real users sign up.
      - key: GOOGLE_CLIENT_ID
        sync: false   # paste your Google OAuth client ID in the Render dashboard (see docs/DEPLOYMENT.md)
      - key: REQUIRE_VERIFICATION
        value: "false"   # no email service is configured yet, so skip the emailed code
databases:
  - name: wazzupp-db
    plan: free
