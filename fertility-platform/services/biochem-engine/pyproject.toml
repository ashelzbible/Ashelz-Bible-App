[project]
name = "biochem-engine"
version = "1.0.0"
description = "Deterministic fertility biomarker calculation engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "numpy>=1.26",
  "scipy>=1.12",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=core --cov=app --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true

[tool.coverage.report]
omit = ["app/asgi.py"]
